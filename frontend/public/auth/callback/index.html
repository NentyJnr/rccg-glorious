<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authenticating Single Sign-On | RCCG Glorious Church</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 24px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h2 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px 0;
      }
      p {
        font-size: 0.875rem;
        color: #94a3b8;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h2>Authenticating with Single Sign-On</h2>
    <p>Please wait, redirecting to your parish dashboard...</p>
    <script>
      // Forward the OAuth/OIDC hash fragment & search parameters to the main SPA application
      const hash = window.location.hash || '';
      const search = window.location.search || '';
      window.location.replace('/' + search + hash);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parish Portal - RCCG Church Management System</title>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/4/4b/RCCG_Logo.png" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rccg: {
              blue: "#003366",
              navy: "#002244",
              lightBlue: "#005A9C",
              red: "#ED1B24",
              green: "#009245",
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .rccg-gradient { background: linear-gradient(135deg, #002244 0%, #003366 60%, #005A9C 100%); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function ParishPortalApp() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [org, setOrg] = useState({
        parishName: 'RCCG Victory Parish',
        logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/4/4b/RCCG_Logo.png',
        baseCurrency: 'NGN'
      });

      const [ministers, setMinisters] = useState([]);
      const [reports, setReports] = useState([
        {
          id: 'r1',
          serviceTypeName: 'Sunday 1st Service',
          category: 'Sunday',
          serviceDate: '2026-09-13',
          menCount: 140,
          womenCount: 180,
          childrenCount: 95,
          totalAttendance: 415,
          firstTimersCount: 18,
          newConvertsCount: 6,
          totalOffering: 245000
        },
        {
          id: 'r2',
          serviceTypeName: 'Digging Deep (Midweek)',
          category: 'Midweek',
          serviceDate: '2026-09-16',
          menCount: 65,
          womenCount: 85,
          childrenCount: 20,
          totalAttendance: 170,
          firstTimersCount: 4,
          newConvertsCount: 1,
          preacherName: 'Pastor Oluwaseun Adeleke',
          totalOffering: 68500
        }
      ]);

      const [users, setUsers] = useState([
        { id: 'u1', fullName: 'John Doe (Admin)', email: 'admin@rccgvictory.org', phone: '+2348012345678', role: 'SystemAdmin', mustChangePassword: false },
        { id: 'u2', fullName: 'Sister Grace', email: 'grace@rccgvictory.org', phone: '+2348023456789', role: 'UsheringDepartment', mustChangePassword: true },
        { id: 'u3', fullName: 'Brother Samuel', email: 'samuel@rccgvictory.org', phone: '+2348034567890', role: 'HouseFellowshipLeader', mustChangePassword: true }
      ]);

      const [notification, setNotification] = useState(null);

      // Fetch Live API Organization Settings on Load
      useEffect(() => {
        fetch('/api/v1/setup/organization')
          .then(res => res.json())
          .then(res => {
            if (res.success && res.data) {
              setOrg(res.data);
            }
          })
          .catch(() => console.log('Using default local org state'));

        fetch('/api/v1/service-reports')
          .then(res => res.json())
          .then(res => {
            if (res.success && res.data && res.data.length > 0) {
              setReports(res.data);
            }
          })
          .catch(() => console.log('Using default local reports state'));
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, reports, users, notification]);

      const showNotice = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      // Form States
      const [serviceCategory, setServiceCategory] = useState('Sunday');
      const [serviceTypeName, setServiceTypeName] = useState('Sunday 1st Service');
      const [serviceDate, setServiceDate] = useState('2026-09-20');
      const [menCount, setMenCount] = useState(110);
      const [womenCount, setWomenCount] = useState(130);
      const [childrenCount, setChildrenCount] = useState(70);
      const [firstTimers, setFirstTimers] = useState(12);
      const [newConverts, setNewConverts] = useState(4);

      const [selectedPreacher, setSelectedPreacher] = useState('Pastor Oluwaseun Adeleke');
      const [midweekOffering, setMidweekOffering] = useState(55000);

      const [sundayOfferings, setSundayOfferings] = useState([
        { name: 'Workers Offering', amount: 35000 },
        { name: 'Sunday School Offering', amount: 25000 },
        { name: 'Children Offering', amount: 18000 },
        { name: 'Love Offering', amount: 60000 },
        { name: 'Thanksgiving & Dedication', amount: 85000 },
        { name: 'Firstfruit & Welfare', amount: 45000 }
      ]);

      const totalCalculatedAttendance = Number(menCount || 0) + Number(womenCount || 0) + Number(childrenCount || 0);
      const totalCalculatedOffering = serviceCategory === 'Midweek'
        ? Number(midweekOffering || 0)
        : sundayOfferings.reduce((sum, item) => sum + Number(item.amount || 0), 0);

      const handleReportSubmit = (e) => {
        e.preventDefault();
        const newRpt = {
          id: 'r_' + Date.now(),
          serviceTypeName: serviceTypeName,
          category: serviceCategory,
          serviceDate: serviceDate,
          menCount: Number(menCount),
          womenCount: Number(womenCount),
          childrenCount: Number(childrenCount),
          totalAttendance: totalCalculatedAttendance,
          firstTimersCount: Number(firstTimers),
          newConvertsCount: Number(newConverts),
          preacherName: serviceCategory === 'Midweek' ? selectedPreacher : undefined,
          totalOffering: totalCalculatedOffering
        };

        setReports([newRpt, ...reports]);
        showNotice(`Service Report recorded! Total Offering: ${org.baseCurrency} ${totalCalculatedOffering.toLocaleString()}`);
        setActiveTab('dashboard');
      };

      // User Onboarding State
      const [newUserName, setNewUserName] = useState('');
      const [newUserEmail, setNewUserEmail] = useState('');
      const [newUserRole, setNewUserRole] = useState('UsheringDepartment');
      const [tempPassNotice, setTempPassNotice] = useState(null);

      const handleUserOnboard = (e) => {
        e.preventDefault();
        if (!newUserName || !newUserEmail) return;

        // Post to backend API
        fetch('/api/v1/auth/onboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fullName: newUserName,
            email: newUserEmail,
            phone: '+2348000000000',
            role: newUserRole
          })
        }).catch(() => {});

        const tempPass = 'Temp' + Math.random().toString(36).slice(-8) + '!';
        const u = {
          id: 'u_' + Date.now(),
          fullName: newUserName,
          email: newUserEmail,
          phone: '+2348000000000',
          role: newUserRole,
          mustChangePassword: true
        };

        setUsers([u, ...users]);
        setTempPassNotice({ email: newUserEmail, tempPass });
        showNotice('User onboarded! Welcome email dispatched.');
        setNewUserName('');
        setNewUserEmail('');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="rccg-gradient text-white shadow-lg sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <div className="flex items-center space-x-4">
                <div className="w-12 h-12 rounded-full bg-white p-1 shadow-md flex items-center justify-center">
                  <img src={org.logoUrl} alt="RCCG Logo" className="h-10 w-10 object-contain" />
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="bg-rccg-red text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">RCCG Parish</span>
                    <span className="text-slate-300 text-xs font-medium">Currency: {org.baseCurrency}</span>
                  </div>
                  <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-white">{org.parishName}</h1>
                </div>
              </div>

              <nav className="flex space-x-1">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'dashboard' ? 'bg-white/20 text-white' : 'text-slate-200 hover:bg-white/10'}`}
                >
                  Dashboard
                </button>
                <button
                  onClick={() => setActiveTab('service-report')}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'service-report' ? 'bg-white/20 text-white' : 'text-slate-200 hover:bg-white/10'}`}
                >
                  Service Reports
                </button>
                <button
                  onClick={() => setActiveTab('users')}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'users' ? 'bg-white/20 text-white' : 'text-slate-200 hover:bg-white/10'}`}
                >
                  User Onboarding
                </button>
                <button
                  onClick={() => setActiveTab('fellowship')}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'fellowship' ? 'bg-white/20 text-white' : 'text-slate-200 hover:bg-white/10'}`}
                >
                  Fellowship & Outreach
                </button>
                <button
                  onClick={() => setActiveTab('setup')}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'setup' ? 'bg-white/20 text-white' : 'text-slate-200 hover:bg-white/10'}`}
                >
                  Setup
                </button>
              </nav>
            </div>
          </header>

          {/* Notification */}
          {notification && (
            <div className={`py-3 px-4 text-center text-white text-sm font-bold shadow-md ${notification.type === 'success' ? 'bg-rccg-green' : 'bg-rccg-red'}`}>
              {notification.msg}
            </div>
          )}

          {/* Content */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
            {activeTab === 'dashboard' && (
              <div className="space-y-8">
                <div className="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-900">Parish Analytics Overview</h2>
                    <p className="text-slate-500 text-sm mt-1">Real-time attendance, offerings, and converts across services.</p>
                  </div>
                  <button
                    onClick={() => setActiveTab('service-report')}
                    className="bg-rccg-blue hover:bg-rccg-navy text-white font-bold px-5 py-2.5 rounded-xl shadow-md"
                  >
                    + Submit Service Report
                  </button>
                </div>

                {/* Metrics */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-rccg-blue">
                    <div className="text-xs font-bold uppercase tracking-wider text-slate-500">Total Attendance</div>
                    <div className="text-3xl font-extrabold text-slate-900 mt-2">
                      {reports.reduce((sum, r) => sum + r.totalAttendance, 0).toLocaleString()}
                    </div>
                    <div className="text-xs text-emerald-600 font-semibold mt-2">Recorded Services: {reports.length}</div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-rccg-green">
                    <div className="text-xs font-bold uppercase tracking-wider text-slate-500">Total Offerings ({org.baseCurrency})</div>
                    <div className="text-3xl font-extrabold text-slate-900 mt-2">
                      {org.baseCurrency} {reports.reduce((sum, r) => sum + r.totalOffering, 0).toLocaleString()}
                    </div>
                    <div className="text-xs text-slate-500 mt-2">Sunday & Midweek total</div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-rccg-red">
                    <div className="text-xs font-bold uppercase tracking-wider text-slate-500">First Timers</div>
                    <div className="text-3xl font-extrabold text-slate-900 mt-2">
                      {reports.reduce((sum, r) => sum + r.firstTimersCount, 0)}
                    </div>
                    <div className="text-xs text-rccg-red font-semibold mt-2">Ushering follow-up</div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-amber-500">
                    <div className="text-xs font-bold uppercase tracking-wider text-slate-500">Souls Won</div>
                    <div className="text-3xl font-extrabold text-slate-900 mt-2">
                      {reports.reduce((sum, r) => sum + r.newConvertsCount, 0)}
                    </div>
                    <div className="text-xs text-emerald-600 font-semibold mt-2">Praise God!</div>
                  </div>
                </div>

                {/* Table */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                    <h3 className="text-lg font-bold text-slate-900">Recent Service Reports</h3>
                    <span className="text-xs text-slate-500">{reports.length} Records</span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-600">
                      <thead className="bg-slate-50 text-slate-700 uppercase text-xs font-bold">
                        <tr>
                          <th className="py-3.5 px-6">Service Name</th>
                          <th className="py-3.5 px-6">Date</th>
                          <th className="py-3.5 px-6">Preacher / Breakdown</th>
                          <th className="py-3.5 px-6">Headcount (M/W/C)</th>
                          <th className="py-3.5 px-6">Total Headcount</th>
                          <th className="py-3.5 px-6">Offering Amount</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {reports.map((r) => (
                          <tr key={r.id} className="hover:bg-slate-50">
                            <td className="py-4 px-6 font-semibold text-slate-900">
                              {r.serviceTypeName}
                              <span className={`block text-[10px] font-bold px-2 py-0.5 rounded-full w-max mt-1 ${r.category === 'Sunday' ? 'bg-blue-100 text-rccg-blue' : 'bg-emerald-100 text-rccg-green'}`}>
                                {r.category}
                              </span>
                            </td>
                            <td className="py-4 px-6">{r.serviceDate}</td>
                            <td className="py-4 px-6 font-medium text-slate-700">{r.preacherName || 'Sunday Line-Items'}</td>
                            <td className="py-4 px-6 text-xs">{r.menCount}M / {r.womenCount}W / {r.childrenCount}C</td>
                            <td className="py-4 px-6 font-bold text-slate-900">{r.totalAttendance}</td>
                            <td className="py-4 px-6 font-extrabold text-rccg-green">{org.baseCurrency} {r.totalOffering.toLocaleString()}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'service-report' && (
              <div className="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                <h2 className="text-xl font-bold text-slate-900 border-b pb-3">Submit Service Attendance & Financial Report</h2>
                <form onSubmit={handleReportSubmit} className="space-y-6">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-700 mb-2">Service Category</label>
                    <div className="grid grid-cols-2 gap-4">
                      <button
                        type="button"
                        onClick={() => { setServiceCategory('Sunday'); setServiceTypeName('Sunday 1st Service'); }}
                        className={`py-3 px-4 rounded-xl text-xs font-bold border ${serviceCategory === 'Sunday' ? 'bg-rccg-blue text-white' : 'bg-white text-slate-700'}`}
                      >
                        Sunday Service
                      </button>
                      <button
                        type="button"
                        onClick={() => { setServiceCategory('Midweek'); setServiceTypeName('Digging Deep'); }}
                        className={`py-3 px-4 rounded-xl text-xs font-bold border ${serviceCategory === 'Midweek' ? 'bg-rccg-green text-white' : 'bg-white text-slate-700'}`}
                      >
                        Midweek Service
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-700 mb-1">Service Name</label>
                      <input type="text" value={serviceTypeName} onChange={(e) => setServiceTypeName(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-700 mb-1">Service Date</label>
                      <input type="date" value={serviceDate} onChange={(e) => setServiceDate(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm" />
                    </div>
                  </div>

                  {/* Attendance */}
                  <div className="border-t pt-4">
                    <h3 className="text-sm font-bold text-slate-800 mb-3">Headcount Breakdown (Calculated Total: {totalCalculatedAttendance})</h3>
                    <div className="grid grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs text-slate-600 mb-1">Men</label>
                        <input type="number" value={menCount} onChange={(e) => setMenCount(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 text-sm font-bold" />
                      </div>
                      <div>
                        <label className="block text-xs text-slate-600 mb-1">Women</label>
                        <input type="number" value={womenCount} onChange={(e) => setWomenCount(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 text-sm font-bold" />
                      </div>
                      <div>
                        <label className="block text-xs text-slate-600 mb-1">Children</label>
                        <input type="number" value={childrenCount} onChange={(e) => setChildrenCount(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 text-sm font-bold" />
                      </div>
                    </div>
                  </div>

                  {/* Financial Conditional */}
                  <div className="border-t pt-4">
                    <h3 className="text-sm font-bold text-slate-800 mb-3">
                      {serviceCategory === 'Midweek' ? 'Midweek Preacher & Financial Summary' : 'Sunday Line-Item Breakdown'}
                    </h3>

                    {serviceCategory === 'Midweek' ? (
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Preacher / Minister *</label>
                          <input type="text" value={selectedPreacher} onChange={(e) => setSelectedPreacher(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm" required />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Offering Amount ({org.baseCurrency})</label>
                          <input type="number" value={midweekOffering} onChange={(e) => setMidweekOffering(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm font-bold" />
                        </div>
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 gap-3">
                        {sundayOfferings.map((item, idx) => (
                          <div key={idx} className="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border">
                            <span className="text-xs font-semibold text-slate-700">{item.name}</span>
                            <input
                              type="number"
                              value={item.amount}
                              onChange={(e) => {
                                const copy = [...sundayOfferings];
                                copy[idx].amount = parseFloat(e.target.value) || 0;
                                setSundayOfferings(copy);
                              }}
                              className="w-24 border rounded px-2 py-1 text-sm font-bold text-right"
                            />
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="flex justify-end pt-4">
                    <button type="submit" className="px-8 py-3 bg-rccg-blue text-white font-bold text-sm rounded-xl shadow-md">
                      Submit Service Report
                    </button>
                  </div>
                </form>
              </div>
            )}

            {activeTab === 'users' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <h3 className="text-lg font-bold text-slate-900 border-b pb-2">Onboard New User</h3>
                  <form onSubmit={handleUserOnboard} className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                      <input type="text" value={newUserName} onChange={(e) => setNewUserName(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 text-sm" required />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                      <input type="email" value={newUserEmail} onChange={(e) => setNewUserEmail(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 text-sm" required />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Role</label>
                      <select value={newUserRole} onChange={(e) => setNewUserRole(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 text-sm">
                        <option value="UsheringDepartment">Ushering Department</option>
                        <option value="HouseFellowshipLeader">House Fellowship Leader</option>
                        <option value="SystemAdmin">System Admin</option>
                      </select>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-rccg-blue text-white font-bold text-sm rounded-xl">
                      Dispatch Onboarding Email
                    </button>
                  </form>

                  {tempPassNotice && (
                    <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs space-y-1">
                      <div className="font-bold text-emerald-800">Temp Pass Generated & Sent</div>
                      <div>User: {tempPassNotice.email}</div>
                      <div>Pass: <code className="bg-white px-1.5 py-0.5 rounded font-mono border">{tempPassNotice.tempPass}</code></div>
                      <div className="text-slate-500 italic">MustChangePassword = true</div>
                    </div>
                  )}
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-4 border-b font-bold text-slate-900">User Accounts Directory</div>
                  <table className="w-full text-left text-sm text-slate-600">
                    <thead className="bg-slate-50 text-xs uppercase font-bold">
                      <tr>
                        <th className="p-3.5">User</th>
                        <th className="p-3.5">Role</th>
                        <th className="p-3.5">Must Change Password</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {users.map((u) => (
                        <tr key={u.id}>
                          <td className="p-3.5 font-bold text-slate-900">{u.fullName}<div className="text-xs text-slate-400 font-normal">{u.email}</div></td>
                          <td className="p-3.5 text-xs">{u.role}</td>
                          <td className="p-3.5">
                            {u.mustChangePassword ? (
                              <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-0.5 rounded-full">Pending Reset</span>
                            ) : (
                              <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-0.5 rounded-full">Active & Verified</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'fellowship' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <h3 className="text-lg font-bold text-slate-900 border-b pb-2">House Fellowship Center Report</h3>
                  <div className="space-y-3">
                    <input type="text" defaultValue="Grace Center - Victoria Island" className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm font-medium" />
                    <div className="grid grid-cols-3 gap-2">
                      <input type="number" defaultValue="8" className="border rounded-lg p-2 text-sm" />
                      <input type="number" defaultValue="12" className="border rounded-lg p-2 text-sm" />
                      <input type="number" defaultValue="5" className="border rounded-lg p-2 text-sm" />
                    </div>
                    <input type="number" defaultValue="25000" className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm font-bold" />
                    <button onClick={() => showNotice('House Fellowship report saved!')} className="w-full py-2.5 bg-rccg-blue text-white font-bold text-sm rounded-xl">
                      Submit Center Report
                    </button>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <h3 className="text-lg font-bold text-slate-900 border-b pb-2">Church on the Street (Outreach)</h3>
                  <div className="space-y-3">
                    <input type="text" defaultValue="Market Square Street Outreach" className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm font-medium" />
                    <div className="grid grid-cols-3 gap-2">
                      <input type="number" defaultValue="30" className="border rounded-lg p-2 text-sm" />
                      <input type="number" defaultValue="45" className="border rounded-lg p-2 text-sm" />
                      <input type="number" defaultValue="20" className="border rounded-lg p-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-rccg-red mb-1">Souls Won (New Converts)</label>
                      <input type="number" defaultValue="14" className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm font-extrabold text-rccg-red" />
                    </div>
                    <button onClick={() => showNotice('Church on the Street outreach recorded!')} className="w-full py-2.5 bg-rccg-red text-white font-bold text-sm rounded-xl">
                      Submit Street Outreach Report
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'setup' && (
              <div className="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h3 className="text-lg font-bold text-slate-900 border-b pb-2">Parish Setup & Branding</h3>
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-700 mb-1">Parish Name</label>
                    <input type="text" value={org.parishName} onChange={(e) => setOrg({ ...org, parishName: e.target.value })} className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm font-bold" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-700 mb-1">Logo URL</label>
                    <input type="text" value={org.logoUrl} onChange={(e) => setOrg({ ...org, logoUrl: e.target.value })} className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-700 mb-1">Base Currency</label>
                    <select value={org.baseCurrency} onChange={(e) => setOrg({ ...org, baseCurrency: e.target.value })} className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm font-bold">
                      <option value="NGN">NGN (Nigerian Naira - ₦)</option>
                      <option value="USD">USD (US Dollar - $)</option>
                      <option value="GBP">GBP (British Pound - £)</option>
                    </select>
                  </div>
                  <button onClick={() => showNotice('Parish Setup updated globally!')} className="px-6 py-2.5 bg-rccg-blue text-white font-bold text-sm rounded-xl">
                    Save Branding Settings
                  </button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ParishPortalApp />);
  </script>
</body>
</html>
